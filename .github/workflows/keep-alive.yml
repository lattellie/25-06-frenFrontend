name: Supabase Storage Keep Alive

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Storage (HEAD)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          curl -I -s \
            "$SUPABASE_URL/storage/v1/object/public/images/keepalive/ping.png"
